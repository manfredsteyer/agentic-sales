<section class="dashboard" aria-label="Dashboard">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <button type="button" (click)="toggleChat()">
      {{ chatVisible() ? 'Hide chat' : 'Show chat' }}
    </button>
  </div>
  <div class="tiles">
    @for (item of items(); track item.id) {
      @switch (item.kind) {
        @case ('barChart') {
          <app-bar-chart-figure [args]="item.args" />
        }
        @case ('pieChart') {
          <app-pie-chart-figure [args]="item.args" />
        }
        @default {
          <app-pivot-table-figure [args]="item.args" />
        }
      }
    } @empty {
      <p class="hint">No charts yet. Ask the assistant for a chart and click "Add to dashboard".</p>
    }
  </div>
  <footer class="dashboard-footer">
    <button type="button" class="clear" [disabled]="items().length === 0" (click)="clear()">
      Clear
    </button>
  </footer>
</section>
@if (chatVisible()) {
  <app-assistant-chat [agentId]="agentId" />
}
