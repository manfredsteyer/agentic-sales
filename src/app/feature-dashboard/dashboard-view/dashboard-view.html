<section class="dashboard" aria-label="Dashboard">
  <header class="page-header">
    <div>
      <h1>Dashboard</h1>
      <p>Charts and tables you pinned from the assistant.</p>
    </div>
    <div class="actions">
      @if (!chatVisible()) {
        <button type="button" class="btn btn-primary" (click)="toggleChat()">
          Show chat
        </button>
      }
    </div>
  </header>
  <div class="tiles">
    <!-- TODO #11: iterate (dashboard) items and call app-dashboard-tile -->
  </div>
</section>
@if (chatVisible()) {
  <aside class="chat-panel" aria-label="Assistant">
    <div class="chat-panel-header">
      <span>Assistant</span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="toggleChat()">
        Hide
      </button>
    </div>

    <!-- TODO #9: Call copilot-chat and assign messageViewChildrenTemplate -->

    <div class="examples" role="group" aria-label="Example requests">
      @for (example of examples; track example.label) {
        <button
          type="button"
          class="chip"
          [title]="example.prompt"
          (click)="sendExample(example)"
        >
          {{ example.label }}
        </button>
      }
    </div>
  </aside>
}

<ng-template #interruptTemplate>
  <app-interrupt-list [agentId]="agentId" />
</ng-template>
