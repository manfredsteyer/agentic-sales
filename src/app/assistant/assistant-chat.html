<copilot-chat [agentId]="agentId()" [messageViewChildrenTemplate]="interruptTemplate" />

<!-- Questions of the agent (AG-UI interrupts), shown below the messages -->
<ng-template #interruptTemplate>
  @for (interrupt of interrupts(); track interrupt.id) {
    <div class="interrupt" role="group" aria-label="Question from the assistant">
      <span class="interrupt-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="14" height="14">
          <path d="M6 6a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.6M8 12h.01" />
        </svg>
      </span>
      <div class="interrupt-body">
        <p class="interrupt-message">{{ interrupt.message }}</p>
        <div class="interrupt-actions">
          @for (option of interrupt.options; track $index) {
            <button
              type="button"
              class="btn btn-sm"
              [class.btn-primary]="$first"
              (click)="resolve(interrupt.id, option.payload)"
            >
              {{ option.label }}
            </button>
          }
        </div>
      </div>
    </div>
  }
</ng-template>
