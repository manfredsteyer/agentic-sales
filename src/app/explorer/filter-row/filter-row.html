<div class="control">
  <label [for]="'filter-col-' + filter().column">Filter</label>
  <div class="row">
    <select
      [id]="'filter-col-' + filter().column"
      [value]="filter().column"
      (change)="setColumn($any($event.target).value)"
    >
      <option value="">– column –</option>
      @for (col of filterColumns(); track col) {
        <option [value]="col" [selected]="col === filter().column">
          {{ col }}
        </option>
      }
    </select>
    <select
      [value]="filter().value"
      [disabled]="!filter().column"
      aria-label="Filter value"
      (change)="setValue($any($event.target).value)"
    >
      <option value="">– value –</option>
      @for (v of values(); track v) {
        <option [value]="v" [selected]="v === filter().value">{{ v }}</option>
      }
    </select>
    <button
      type="button"
      class="remove"
      aria-label="Remove filter"
      (click)="removed.emit()"
    >
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M4 4l8 8M12 4l-8 8" />
      </svg>
    </button>
  </div>
</div>
