<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stock</title>
    <style>
      :root {
        --surface: #ffffff;
        --track: #eef1f6;
        --border: #e2e7ee;
        --text-primary: #111827;
        --text-secondary: #5b6779;
        --text-muted: #8b96a7;
        --color-ring-primary: #475569;
      }

      body {
        margin: 0;
        color: var(--text-primary);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 0.9375rem;
        -webkit-font-smoothing: antialiased;
      }

      main {
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--surface);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }

      ul {
        display: grid;
        gap: 0.875rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.375rem;
        color: var(--text-secondary);
      }

      li strong {
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
      }

      .bar {
        grid-column: 1 / -1;
        height: 0.625rem;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }

      .bar span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--color-ring-primary) 65%, white),
          var(--color-ring-primary)
        );
        animation: grow 0.6s ease-out;
      }

      .scale {
        display: flex;
        justify-content: space-between;
        margin-top: 0.25rem;
        color: var(--text-muted);
        font-size: 0.75rem;
      }

      .total {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin: 1rem 0 0;
        padding-top: 0.875rem;
        border-top: 1px solid var(--border);
        color: var(--text-secondary);
      }

      .total strong {
        color: var(--text-primary);
        font-size: 1.25rem;
        font-variant-numeric: tabular-nums;
      }

      @keyframes grow {
        from {
          width: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <ul id="warehouses"></ul>
      <div class="scale"><span>0</span><span>1,000</span></div>
      <p class="total">Total <strong id="total"></strong></p>
    </main>
    <script type="module" src="./stock-widget.ts"></script>
  </body>
</html>
